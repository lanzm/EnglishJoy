<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="#2B82F6" />

  <!-- Back Card (Tilted -10deg) -->
  <g transform="translate(256, 256) rotate(-10) translate(-256, -256)">
    <rect x="153" y="130" width="196" height="252" rx="30" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- Front Card (Tilted +6deg, with dynamic shadow) -->
  <g transform="translate(256, 256) rotate(6) translate(-256, -256)" filter="url(#card-shadow)">
    <!-- Card Body -->
    <rect x="163" y="130" width="196" height="252" rx="30" fill="#FFFFFF"/>
    
    <!-- Primary Word Bar & Dot (Height 36px, Dot 36px) -->
    <rect x="189" y="182" width="102" height="36" rx="18" fill="#2B82F6"/>
    <circle cx="317" cy="200" r="18" fill="#2B82F6"/>
    
    <!-- Secondary Meaning / Phonetic Bar (Height 24px) -->
    <rect x="189" y="236" width="146" height="24" rx="12" fill="rgba(43, 130, 246, 0.5)"/>
    
    <!-- Bottom Example Sentence Bar (Height 16px) -->
    <rect x="189" y="276" width="96" height="16" rx="8" fill="rgba(43, 130, 246, 0.3)"/>
  </g>
</svg>