<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="#0F172A" />

  <!-- Back Card (Tilted -10deg) -->
  <g transform="translate(256, 256) rotate(-10) translate(-256, -256)">
    <rect x="134" y="107" width="231" height="297" rx="35" fill="#2B82F6" opacity="0.28"/>
  </g>

  <!-- Front Card (Tilted +6deg, with dynamic shadow) -->
  <g transform="translate(256, 256) rotate(6) translate(-256, -256)" filter="url(#card-shadow)">
    <!-- Card Body -->
    <rect x="146" y="107" width="231" height="297" rx="35" fill="#2B82F6"/>
    
    <!-- Primary Word Bar & Dot -->
    <rect x="177" y="168" width="120" height="42" rx="21" fill="#FFFFFF"/>
    <circle cx="328" cy="189" r="21" fill="#FFFFFF"/>
    
    <!-- Secondary Meaning Bar -->
    <rect x="177" y="232" width="172" height="28" rx="14" fill="rgba(255, 255, 255, 0.6)"/>
    
    <!-- Bottom Example Bar -->
    <rect x="177" y="279" width="113" height="19" rx="9.5" fill="rgba(255, 255, 255, 0.35)"/>
  </g>
</svg>