<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="#121216" stroke="#262630" stroke-width="3"/>

  <!-- Back Card (Tilted -10deg) -->
  <g transform="translate(256, 256) rotate(-10) translate(-256, -256)">
    <rect x="156" y="140" width="180" height="232" rx="28" fill="#2B82F6" opacity="0.35"/>
  </g>

  <!-- Front Card (Tilted +6deg, with dynamic shadow) -->
  <g transform="translate(256, 256) rotate(6) translate(-256, -256)" filter="url(#card-shadow)">
    <!-- Card Body -->
    <rect x="166" y="140" width="180" height="232" rx="28" fill="#FFFFFF"/>
    
    <!-- Primary Word Bar & Dot -->
    <rect x="198" y="202" width="82" height="18" rx="9" fill="#2B82F6"/>
    <circle cx="300" cy="211" r="9" fill="#2B82F6"/>
    
    <!-- Secondary Meaning / Phonetic Bar -->
    <rect x="198" y="234" width="116" height="12" rx="6" fill="rgba(43, 130, 246, 0.45)"/>
    
    <!-- Subtle bottom progress pill/accent -->
    <rect x="198" y="260" width="48" height="8" rx="4" fill="rgba(43, 130, 246, 0.45)" opacity="0.6"/>
  </g>
</svg>